<app-meter-results-chart
  [ariaLabel]="period() + ' meter group results chart'"
  loadingTitle="Calculating group results"
  loadingDescription="VERIFI is preparing calendarized meter data for this group."
  errorTitle="Results could not be calculated"
  errorDescription="Check the meter data for this group and try again."
  [emptyTitle]="'No ' + period() + ' results to chart'"
  emptyDescription="Add meter data to this group to see charted results."
  [downloadFileName]="period() === 'yearly' ? 'meter-group-yearly-data-chart' : 'meter-group-monthly-data-chart'"
  [period]="period()"
  [joinsFollowingSection]="period() === 'yearly'"
  [state]="workspace.calendarizationState()"
  [chartRows]="chartRows()"
  [metrics]="metrics()"
  defaultLeftMetricId="utility"
  defaultRightMetricId="cost">
</app-meter-results-chart>
