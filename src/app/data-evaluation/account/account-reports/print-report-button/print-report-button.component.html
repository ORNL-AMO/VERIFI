<div class="button-div hide-print" [ngStyle]="{'right.px': helpWidth}">
  <div class="d-flex flex-column">
    @if (selectedReport.reportType == 'betterPlants' || selectedReport.reportType == 'betterClimate' ||
    selectedReport.reportType == 'analysis') {
    <div class="p-2">
      <button class="btn action-btn w-100" (click)="generateExcel()" title="Generate Excel Report">
        <span class="fa fa-file-excel"></span>
      </button>
    </div>
    }
    <div class="p-2">
      <button class="btn action-btn" (click)="togglePrint()" title="Generate PDF Report">
        <span class="fa fa-file-pdf"></span>
      </button>
    </div>
    @if (selectedReport.reportType == 'accountSavings') {
    <button class="btn action-btn" (click)="generatePPT()" title="Generate PowerPoint Report">
      <span class="fa fa-file-powerpoint"></span>
    </button>
    }
  </div>
</div>

@if (isLoading) {
    <div class="loading-overlay">
        <app-calculating-spinner [message]="'Generating PDF...'"></app-calculating-spinner>
    </div>
}
