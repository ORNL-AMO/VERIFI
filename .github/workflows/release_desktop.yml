name: "Release: Desktop"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    if: github.ref_name == 'master'
    permissions:
      contents: read
    uses: ./.github/workflows/package_desktop.yml
    with:
      source-sha: ${{ github.sha }}
      artifact-prefix: release
      retention-days: 1
    secrets: inherit

  # Production web deployment still waits for packaging, signing, verification,
  # artifact collection, and immutable draft release creation to finish.
  release:
    if: github.ref_name == 'master'
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read release version
        id: version
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
      - name: Get verified distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-artifact
          path: release/
          merge-multiple: true
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: VERIFI v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
