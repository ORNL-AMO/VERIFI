
  <section class="report-section report-setup" aria-label="Report setup">
    <div class="report-setup-section report-setup-top report-setup-top--with-period">
      <div>
        <h2>Report information</h2>
        <div class="report-setup-field report-setup-name">
          <label for="account-report-name">Name <span class="report-setup-required" aria-hidden="true">*</span></label>
          <input id="account-report-name" class="v1-input" [formControl]="editor.form.controls.name" autocomplete="off" required [attr.aria-invalid]="editor.state() === 'invalid' ? true : null" [attr.aria-describedby]="editor.state() === 'invalid' ? 'account-report-name-help' : null">
          @if (editor.state() === 'invalid') { <p id="account-report-name-help" class="report-setup-help v1-field-error">Enter a nonblank report name.</p> }
        </div>
          <section class="report-setup-content" [formGroup]="editor.form.controls.betterPlants" aria-labelledby="better-plants-content-title">
            <h3 id="better-plants-content-title">Included content</h3>
            <label class="report-setup-option"><input type="checkbox" formControlName="includePerformanceTable"><span>Facility performance table</span></label>
            @if (editor.form.controls.betterPlants.controls.includePerformanceTable.value) {
              <label class="report-setup-option report-setup-content__names"><input type="checkbox" formControlName="includeFacilityNames"><span>Show facility names</span></label>
            }
          </section>
      </div>
      <app-better-plants-reporting-period/>
    </div>
    <div class="report-setup-section"><app-account-report-analysis-selection/></div>
    <app-better-plants-setup/>
    <app-account-report-delete/>
  </section>
