<div class="items-per-page h-100">
    <!-- <span>Show </span> -->
    <select class="form-select" [(ngModel)]="itemsPerPage" (change)="save()">
        @for (pageSize of pageSizeOptions; track pageSize) {
            <option [ngValue]="pageSize">{{ pageSize }}</option>
        }
        <option [ngValue]="allRowsPageSize">All</option>
    </select>
</div>
