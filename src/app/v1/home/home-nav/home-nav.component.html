<section class="v1-nav__group" aria-labelledby="home-nav-title">
  <span id="home-nav-title" class="v1-nav__label">Home dashboards</span>
  @for (entry of home.entries(); track entry.key) {
    <a class="v1-nav__link" [routerLink]="entry.route" [class.active]="entry.key === home.selectedGuid()" [attr.aria-current]="entry.key === home.selectedGuid() ? 'page' : null">{{ entry.name }}{{ entry.key === home.configuredDefaultGuid() ? ' (Default)' : '' }}</a>
  } @empty {
    <a class="v1-nav__link" [routerLink]="home.ownerRoute()">{{ home.owner() ? 'No dashboards' : 'Home recovery' }}</a>
  }
  <button type="button" class="v1-nav__link" [disabled]="!editor.canStart() || home.view()?.initialization === 'unavailable'" (click)="editor.beginCreate()">Add dashboard</button>
</section>
