@let state = results.state();
<section class="v1-analysis-results-page" aria-label="Facility annual results">
  @if (context.hasBlockingErrors() || state.state !== 'ready' || !rows().length) {
  <div class="v1-analysis-results-page__intro v1-analysis-results-page__intro--standalone">
    <app-analysis-result-status
      scope="facility"
      period="annual"
      [state]="state"
      [blocking]="context.hasBlockingErrors()"
      [rowCount]="rows().length">
    </app-analysis-result-status>
  </div>
  }

  @if (!context.hasBlockingErrors() && state.state === 'ready' && rows().length) {
    <section class="v1-analysis-results-page__table" aria-label="Facility annual analysis table">
      <div class="v1-analysis-results-page__table-actions" aria-label="Annual table controls">
        <app-analysis-result-column-chooser
          period="annual"
          [hasBanking]="hasBanking()"
          [showModeled]="false"
          [predictorScopeId]="predictorScopeId()"
          [predictorVariables]="availablePredictors()">
        </app-analysis-result-column-chooser>
      </div>
      <app-analysis-results-table [view]="tableView()" period="annual"
        caption="Facility annual analysis results" [unit]="unit()" [category]="context.analysis()?.analysisCategory ?? 'energy'"/>
      <app-analysis-result-marker-legend [markers]="legendMarkers()"></app-analysis-result-marker-legend>
    </section>

    <app-analysis-result-charts class="v1-analysis-results-page__charts" [view]="charts()" scope="facility"/>
  }
</section>
