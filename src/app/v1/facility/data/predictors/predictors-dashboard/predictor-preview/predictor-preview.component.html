<section class="predictor-preview" aria-label="Selected predictor monthly preview">
  <header><div><h2>{{ entry()?.card?.predictor?.name || 'Monthly data' }} <small>{{ entry()?.card?.predictor?.unit }}</small></h2><p>{{ coverage() }}</p></div>
    <div class="predictor-preview__controls" role="group" aria-label="Preview zoom">
      <button class="v1-icon-btn" type="button" aria-label="Zoom in" [disabled]="!rows().length || zoom().end - zoom().start <= 10" (click)="changeZoom(.6)"><app-ui-icon name="zoomIn"/></button>
      <button class="v1-icon-btn" type="button" aria-label="Zoom out" [disabled]="!rows().length || zoom().end - zoom().start >= 100" (click)="changeZoom(1 / .6)"><app-ui-icon name="zoomOut"/></button>
      <button class="v1-icon-btn" type="button" aria-label="Reset zoom" [disabled]="!rows().length" (click)="zoomChanged.emit({ start: 0, end: 100 })"><app-ui-icon name="refresh"/></button>
    </div>
  </header>
  @if (rows().length) {
    <app-meter-results-chart [chartRows]="rows()" [metrics]="metrics()" state="ready" [embedded]="true" [compact]="true" ariaLabel="Selected predictor monthly readings" period="monthly" [showAllMetrics]="true" [showLegend]="false" [showChartActions]="false" [showSeriesControls]="false" [compactAxes]="true" [allowNegativeValues]="true" [smoothLines]="false" [zoomRange]="zoom()" (zoomRangeChanged)="zoomChanged.emit($event)"/>
  } @else { <p class="predictor-preview__empty" role="status">{{ entry() ? 'This predictor has no monthly readings with valid dates.' : 'No predictors match these filters.' }}</p> }
</section>
