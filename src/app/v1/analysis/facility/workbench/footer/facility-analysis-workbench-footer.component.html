<footer class="v1-wizard-actions" aria-label="Analysis workflow navigation">
  <button
    type="button"
    class="v1-btn v1-btn--quiet"
    [disabled]="workflow.navigationBlocked()"
    [attr.aria-describedby]="workflow.navigationBlocked() && workflow.requirement() ? 'v1-analysis-navigation-requirement' : null"
    (click)="workflow.back()">
    <app-ui-icon name="chevronLeft"></app-ui-icon> Back
  </button>
  <div class="v1-wizard-actions__next">
    <span
      id="v1-analysis-navigation-requirement"
      class="v1-wizard-actions__requirement"
      role="status"
      aria-live="polite">{{ workflow.requirement() || '' }}</span>
    @if (workflow.activeStageId() === 'used-by') {
      <div class="analysis-add-actions">
        @if (usage.showAccountAction()) {
          <button type="button" class="v1-btn v1-btn--secondary" [disabled]="!usage.canAct() || !!usage.editor()" (click)="usage.open('account-analysis')"><app-ui-icon name="add"/> Add Account Analysis</button>
        }
        <button type="button" class="v1-btn v1-btn--action" [disabled]="!usage.canAct() || !!usage.editor() || !!usage.reportUnavailable()" [title]="usage.reportUnavailable() || ''" (click)="usage.open('report')"><app-ui-icon name="add"/> Add Report</button>
        @if (usage.reportUnavailable(); as reason) { <span class="v1-wizard-actions__requirement" role="status">{{ reason }}</span> }
      </div>
    } @else if (workflow.nextStage()) {
      <button
        type="button"
        class="v1-btn v1-btn--action"
        [disabled]="workflow.disabled()"
        [attr.aria-describedby]="workflow.requirement() ? 'v1-analysis-navigation-requirement' : null"
        (click)="workflow.continue()">
        Continue <app-ui-icon name="chevronRight"></app-ui-icon>
      </button>
    }
  </div>
</footer>
