@let summaries = filteredSummaries();
<section [appBrowsePosition]="browseKey()" [browsePositionReady]="browseReady()" [browseRestoreStickyGap]="true" [browseVisibleIds]="browseIds()" class="facility-portfolio" aria-label="Portfolio facilities">
  <form class="v1-data-browse-toolbar portfolio-inventory-toolbar" aria-label="Facility filters" [formGroup]="filtersForm">
    <div class="v1-portfolio-browse-search">
      <p class="v1-portfolio-browse-count" role="status">Showing {{ summaries.length }} of {{ facilitySummaries().length }} facilities</p>
      <div class="v1-data-browse-search">
        <span class="input-group-text"><app-ui-icon name="search"></app-ui-icon></span>
        <input id="v1-portfolio-facility-search" type="search" aria-label="Find facility, location, or type" placeholder="Find facility, location, or type" formControlName="search">
      </div>
    </div>
    <label>
      <span>Status</span>
      <select class="v1-select" formControlName="status">
        <option value="all">All</option>
        <option value="attention">Needs attention</option>
        <option value="error">Errors</option>
        <option value="warning">Warnings</option>
        <option value="noMeters">No meters</option>
        <option value="noReadings">No readings</option>
      </select>
    </label>
    <label>
      <span>Sort</span>
      <select class="v1-select" formControlName="sort">
        <option value="facilityName">Facility name</option>
        <option value="attention">Attention first</option>
        <option value="modified">Latest activity</option>
      </select>
    </label>
    <label><span>Detail level</span><select class="v1-select" aria-label="Detail level" [formControl]="inventory.detailControl"><option value="simple">Simple</option><option value="summary">Summary</option><option value="detailed">Detailed</option></select></label>
  </form>
  @if (navigationError()) { <p class="v1-alert v1-alert--danger" role="alert">{{ navigationError() }}</p> }
  @if (!summaries.length) {
    <app-data-empty-state icon="clearFilter" title="No facilities match these filters" description="Adjust the search or filters to return to the full portfolio.">
      <button type="button" class="v1-btn v1-btn--secondary" (click)="clearFilters()">Clear filters</button>
    </app-data-empty-state>
  } @else {
    <app-inventory-grid [actions]="cardActions.actions()" [actionsByGuid]="cardActions.actionsByGuid()" (actionRequested)="cardActions.request($event)" [tiles]="inventory.visibleTiles()" [printTiles]="tiles()" [detail]="inventory.detail()" [overrides]="inventory.overrides()" [page]="inventory.page()" [pages]="inventory.pages()" [start]="inventory.start()" [end]="inventory.end()" [total]="summaries.length" (detailChanged)="inventory.setTileDetail($event)" (pageSelected)="inventory.selectPage($event)" (navigationRequested)="navigateRoute($event)"/>
  }
</section>

<app-account-inventory-actions #cardActions resource="facilities"/>
