<ul class="meter-directory" [class.meter-directory--rounded-bottom]="roundedBottom()" [class.meter-directory--two-columns]="twoColumns()" role="list" aria-label="Meters" [formGroup]="selectionForm">
  @for (entry of rows(); track entry.guid) {
    <li [attr.data-tone]="entry.tone" (mouseenter)="emphasized.emit(entry.guid)" (mouseleave)="emphasized.emit(undefined)" (focusin)="emphasized.emit(entry.guid)" (focusout)="leaveRow($event)">
      @if (selecting()) {
        <input type="checkbox" [formControlName]="entry.guid" [attr.aria-label]="'Select ' + entry.card.meter.name">
      }
      <button type="button" class="meter-directory__open" [attr.data-browse-id]="entry.guid" [ngbTooltip]="entry.tooltip" tooltipClass="v1-meter-tooltip" triggers="hover focus" placement="auto"
        [attr.aria-describedby]="entry.descriptionId" (click)="action.emit({ guid: entry.guid, action: 'settings' })">
        <svg class="meter-directory__swatch" viewBox="0 0 24 12" aria-hidden="true"><line x1="0" y1="6" x2="24" y2="6" [style.stroke]="entry.color" stroke-width="3" [attr.stroke-dasharray]="entry.dashArray"/></svg>
        <span class="meter-directory__identity">
          <strong>{{ entry.card.meter.name }}<app-ui-icon class="meter-directory__name-arrow" name="chevronRight"/></strong>
          <span class="meter-directory__metadata">
            <span class="meter-directory__source"><app-ui-icon [name]="entry.card.sourceIcon || 'meter'"/><span>{{ entry.card.meter.source }}</span></span>
            <span class="meter-directory__status"><app-ui-icon [name]="entry.statusIcon"/><span [class.visually-hidden]="entry.tone === 'success'">{{ entry.statusLabel }}</span></span>
          </span>
        </span>
      </button>
      <span class="visually-hidden" [id]="entry.descriptionId">Monthly data: {{ entry.coverage }}</span>
      <div ngbDropdown placement="bottom-end" class="meter-directory__menu">
        <button type="button" class="v1-icon-btn" ngbDropdownToggle [attr.aria-label]="'Actions for ' + entry.card.meter.name"><span aria-hidden="true">⋯</span></button>
        <div ngbDropdownMenu>
          <button ngbDropdownItem type="button" (click)="action.emit({ guid: entry.guid, action: 'readings' })">Open readings</button>
          <button ngbDropdownItem type="button" [disabled]="!canAct()" (click)="action.emit({ guid: entry.guid, action: 'copy' })">Copy meter</button>
          <button ngbDropdownItem type="button" [disabled]="!canAct()" (click)="action.emit({ guid: entry.guid, action: 'delete' })">Delete meter</button>
        </div>
      </div>
    </li>
  }
</ul>
