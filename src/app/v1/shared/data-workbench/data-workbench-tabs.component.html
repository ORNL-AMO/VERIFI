<nav
  class="v1-data-tabs v1-data-tabs--connected"
  [class.v1-data-tabs--secondary]="level === 'secondary'"
  [attr.aria-label]="ariaLabel">
  @for (tab of tabs; track tab.id) {
    @let tabAttention = attention[tab.id];
    @let disabledDescriptionId = idPrefix + '-disabled-' + tab.id;
    <button
      type="button"
      class="v1-data-tabs__tab"
      [class.v1-data-tabs__tab--active]="activeTab === tab.id"
      [attr.aria-disabled]="tab.disabled ? 'true' : null"
      [attr.aria-describedby]="tab.disabled && tab.disabledReason ? disabledDescriptionId : null"
      [attr.title]="tab.disabledReason || null"
      [attr.aria-current]="activeTab === tab.id ? 'page' : null"
      (click)="selectTab(tab)">
      <app-ui-icon [name]="tab.icon"></app-ui-icon>
      {{ tab.label }}
        <app-status-attention [summary]="tabAttention" [contextLabel]="tab.label" [display]="attentionDisplay"></app-status-attention>
    </button>
    @if (tab.disabled && tab.disabledReason) {
      <span class="visually-hidden" [id]="disabledDescriptionId">{{ tab.disabledReason }}</span>
    }
  }
</nav>
