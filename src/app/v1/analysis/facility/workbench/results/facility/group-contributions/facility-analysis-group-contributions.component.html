@let state = results.state();
<section class="v1-analysis-contributions" aria-label="Facility group contributions">
  @if (context.hasBlockingErrors() || state.state !== 'ready' || !rows().length) {
    <div class="v1-analysis-contributions__intro">
      <app-analysis-result-status
        scope="facility"
        period="annual"
        [state]="state"
        [blocking]="context.hasBlockingErrors()"
        [rowCount]="rows().length">
      </app-analysis-result-status>
    </div>
  }

  @if (!context.hasBlockingErrors() && state.state === 'ready' && rows().length) {
    <app-group-contributions [view]="view()" [unit]="unit()"/>
  }
</section>
