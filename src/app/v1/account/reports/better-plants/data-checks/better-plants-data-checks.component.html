@let result = report.state();
@if (result.state === 'loading' || result.state === 'waiting') {
  <section class="report-section"><p role="status">{{ result.message }}</p></section>
}
@if (result.state === 'error') {
  <section class="report-section">
    <div class="v1-alert v1-alert--danger" role="alert">{{ result.message }}</div>
    <a [routerLink]="context.navigation.accountReportWorkbenchRoute(context.report()!.accountId, context.guid())">Review report setup</a>
    <button type="button" class="v1-btn v1-btn--secondary" (click)="report.retry()">Retry checks</button>
  </section>
}
@if (result.state === 'ready' && result.value; as value) {
  <app-analysis-data-checks [checks]="value.checks ?? []" [findings]="context.findings()" [groupNames]="groupNames()" [facilityNames]="facilityNames()"/>
}
