<nav class="v1-data-tabs v1-data-tabs--connected" aria-label="Meter workbench sections">
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      class="v1-data-tabs__tab"
      [class.v1-data-tabs__tab--active]="activeTab === tab.id"
      (click)="selectTab(tab.id)"
      [attr.aria-current]="activeTab === tab.id ? 'page' : null">
      <app-ui-icon [name]="tab.icon"></app-ui-icon>
      {{ tab.label }}
    </button>
  }
</nav>
