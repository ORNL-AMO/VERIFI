@let allMeters = meters();
@let visibleMeters = filteredMeters();

<section [appBrowsePosition]="browseKey()" [browsePositionReady]="browseReady()" [browseRestoreStickyGap]="true" [browseVisibleIds]="browseIds()" class="v1-account-portfolio-meters" aria-label="Portfolio meters">
  <form class="v1-data-browse-toolbar portfolio-inventory-toolbar" aria-label="Meter filters" [formGroup]="filtersForm">
    <div class="v1-portfolio-browse-search">
      <p class="v1-portfolio-browse-count" role="status">Showing {{ visibleMeters.length }} of {{ allMeters.length }} meters</p>
      <div class="v1-data-browse-search">
        <span class="input-group-text">
          <app-ui-icon name="search"></app-ui-icon>
        </span>
        <input
          id="v1-portfolio-meter-search"
          type="search"
          aria-label="Find meter, facility, source, group, or status"
          placeholder="Find meter, facility, source, group, or status"
          formControlName="search">
      </div>
    </div>

    <label>
      <span>Status</span>
      <select class="v1-select" formControlName="status">
        <option value="all">All</option>
        <option value="attention">Needs attention</option>
        <option value="noReadings">No readings</option>
        <option value="missingGroup">Missing group</option>
        <option value="valid">All data valid</option>
      </select>
    </label>

    <label>
      <span>Sort</span>
      <select class="v1-select" formControlName="sort">
        <option value="attention">Attention first</option>
        <option value="facilityName">Facility name</option>
        <option value="latestReading">Latest reading</option>
      </select>
    </label>
    <label><span>Facility</span><select class="v1-select" formControlName="facilityGuid" aria-label="Facility"><option value="">All facilities</option>@for (facility of facilities(); track facility.guid) { <option [value]="facility.guid">{{ facility.name }}</option> }</select></label>
    <label><span>Detail level</span><select class="v1-select" aria-label="Detail level" [formControl]="inventory.detailControl"><option value="simple">Simple</option><option value="summary">Summary</option><option value="detailed">Detailed</option></select></label>
  </form>

  @if (navigationError()) { <p class="v1-alert v1-alert--danger" role="alert">{{ navigationError() }}</p> }
  @if (allMeters.length === 0) {
    <app-data-empty-state
      icon="meter"
      title="No meters"
      description="Meters will appear here after you add or upload them for a facility.">
    </app-data-empty-state>
  } @else if (visibleMeters.length === 0) {
    <app-data-empty-state
      icon="clearFilter"
      title="No meters match these filters"
      description="Adjust the search or filter controls to return to the full meter list.">
      <button type="button" class="v1-btn v1-btn--secondary" (click)="clearFilters()">Clear filters</button>
    </app-data-empty-state>
  } @else {
    <app-inventory-grid [actions]="cardActions.actions()" [actionsByGuid]="cardActions.actionsByGuid()" (actionRequested)="cardActions.request($event)" [tiles]="inventory.visibleTiles()" [printTiles]="tiles()" [detail]="inventory.detail()" [overrides]="inventory.overrides()" [page]="inventory.page()" [pages]="inventory.pages()" [start]="inventory.start()" [end]="inventory.end()" [total]="visibleMeters.length" (detailChanged)="inventory.setTileDetail($event)" (pageSelected)="inventory.selectPage($event)" (navigationRequested)="navigateRoute($event)"/>
  }
</section>

<app-account-inventory-actions #cardActions resource="meters"/>
