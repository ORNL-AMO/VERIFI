<app-meter-slideout
  title="Add meter"
  description="Create the meter, then continue setup in its workbench."
  [saving]="saving"
  (closed)="cancelled.emit()">
  <form class="v1-meter-slideout-form" [formGroup]="form" (ngSubmit)="submit()">
    <ng-content select="[meterContext]"></ng-content>
    @if (error) {
      <div class="v1-alert v1-alert--danger" role="alert">{{ error }}</div>
    }
    <label>
      <span>Meter name</span>
      <input type="text" formControlName="name" required>
    </label>

    <label>
      <span>Source</span>
      <select class="v1-select" formControlName="source" required>
        @for (source of sources; track source) {
          <option [value]="source">{{ source }}</option>
        }
      </select>
    </label>

    <label>
      <span>Group</span>
      <select class="v1-select" formControlName="groupId">
        <option [ngValue]="undefined">Ungrouped</option>
        @for (group of groups; track group.guid) {
          <option [value]="group.guid" [disabled]="!isGroupAllowed(group)">
            {{ group.name }} ({{ group.groupType }})
          </option>
        }
      </select>
    </label>

    @if (!isValid() && draft().name.trim().length > 0) {
      <div class="v1-alert v1-alert--warning" role="alert">
        <app-ui-icon name="warning"></app-ui-icon>
        <span>This source cannot be assigned to the selected group type.</span>
      </div>
    }

    <footer class="v1-meter-slideout-form__footer">
      <button type="button" class="v1-btn v1-btn--quiet" [disabled]="saving" (click)="cancelled.emit()">Cancel</button>
      <button type="submit" class="v1-btn v1-btn--action" [disabled]="saving || !canSubmit || !isValid()">
        @if (saving) {
          <app-ui-icon name="loading" spin></app-ui-icon>
        } @else {
          <app-ui-icon name="add"></app-ui-icon>
        }
        Add meter
      </button>
    </footer>
  </form>
</app-meter-slideout>
