<app-workspace-slideout title="Add report" [saving]="saving" [hasFooter]="true" (closed)="closeRequested.emit()">
  <form id="facility-report-draft" [formGroup]="form" (ngSubmit)="canSave && submitted.emit()">
    <fieldset [disabled]="saving">
    <label for="facility-report-name">Report name</label>
    <input id="facility-report-name" class="form-control" formControlName="name" autocomplete="off" [readOnly]="saving" aria-describedby="facility-report-draft-help">
    @if (form.controls.name.invalid && form.controls.name.touched) { <p class="v1-alert v1-alert--danger" role="alert">Enter a report name.</p> }
    <label for="facility-report-type">Report type</label>
    <select id="facility-report-type" class="v1-select" formControlName="type">
      @for (option of reportTypes; track option.value) { <option [value]="option.value">{{ option.label }}</option> }
    </select>
    </fieldset>
    <p id="facility-report-draft-help">Report settings and preview will be added in later migrations. Save or cancel your edits before leaving this page.</p>
    @if (error) { <div class="v1-alert v1-alert--danger" role="alert">{{ error }}</div> }
  </form>
  <div slideoutFooter class="report-draft-actions">
    <button type="button" class="v1-btn v1-btn--secondary" [disabled]="saving" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" form="facility-report-draft" class="v1-btn v1-btn--action" [disabled]="!canSave">
      @if (saving) { <app-ui-icon name="loading" spin></app-ui-icon> }
      Create report
    </button>
  </div>
</app-workspace-slideout>
