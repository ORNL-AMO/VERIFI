<app-confirmation-dialog
  [title]="'Delete ' + card.meter.name + '?'"
  titleId="v1-delete-meter-title"
  cancelAriaLabel="Cancel delete meter"
  confirmLabel="Delete meter"
  confirmIcon="delete"
  [busy]="saving"
  [disabled]="saving"
  (confirmed)="confirmed.emit()"
  (cancelled)="cancelled.emit()">
  <p>
    This meter and its {{ card.readingCount }}
    {{ card.readingCount === 1 ? 'reading' : 'readings' }} will be removed.
  </p>
  @if (error) {
    <div class="v1-alert v1-alert--danger" role="alert">
      <app-ui-icon name="warning"></app-ui-icon>
      <span>{{ error }}</span>
    </div>
  }
</app-confirmation-dialog>
