<footer class="v1-wizard-actions" aria-label="Account analysis workflow navigation">
  <button
    type="button"
    class="v1-btn v1-btn--quiet"
    [disabled]="workflow.backDisabled()"
    [attr.aria-describedby]="workflow.backDisabled() && workflow.requirement() ? 'v1-account-analysis-navigation-requirement' : null"
    (click)="workflow.back()">
    <app-ui-icon name="chevronLeft"></app-ui-icon> Back
  </button>
  <div class="v1-wizard-actions__next">
    <span id="v1-account-analysis-navigation-requirement" class="v1-wizard-actions__requirement" role="status" aria-live="polite">
      {{ workflow.requirement() || '' }}
    </span>
    @if (workflow.nextStage()) {
      <button
        type="button"
        class="v1-btn v1-btn--action"
        [disabled]="workflow.disabled()"
        [attr.aria-describedby]="workflow.requirement() ? 'v1-account-analysis-navigation-requirement' : null"
        (click)="workflow.continue()">
        Continue <app-ui-icon name="chevronRight"></app-ui-icon>
      </button>
    } @else {
      <button
        type="button"
        class="v1-btn v1-btn--action"
        [disabled]="workflow.disabled()"
        [attr.aria-describedby]="workflow.requirement() ? 'v1-account-analysis-navigation-requirement' : null"
        (click)="workflow.finish()">
        Finish <app-ui-icon name="check"></app-ui-icon>
      </button>
    }
  </div>
</footer>
