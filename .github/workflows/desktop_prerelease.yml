name: Desktop pre-release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build signed packages, exercise retained packages, or build without installed tests.
        type: choice
        options: [build-only, build-and-test, test-only]
        default: build-only
      scenario:
        description: Required baseline/candidate source relationships
        type: choice
        options: [baseline-validation, electron-upgrade]
        default: baseline-validation
      test_platform:
        description: Use Windows for the initial pilot; all platforms are required for acceptance.
        type: choice
        options: [all, windows, mac, linux]
        default: all
      candidate_ref:
        description: Candidate commit or ref (leave empty for test-only)
        type: string
      baseline_ref:
        description: Baseline commit or ref; alternatively supply baseline_run_id
        type: string
      baseline_run_id:
        description: Successful retained QA run supplying the baseline
        type: string
      artifact_run_id:
        description: Original package run to reuse in test-only mode
        type: string

permissions: {}

# The shared signing runner is serialized; test-only jobs will not need this group.
concurrency:
  group: desktop-qa-${{ inputs.mode == 'test-only' && github.run_id || 'packaging' }}
  cancel-in-progress: false

jobs:
  resolve:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      candidate-sha: ${{ steps.plan.outputs.candidate-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - name: Require installed-app harness for test operations
        if: inputs.mode != 'build-only'
        run: |
          test -f scripts/desktop/run-update-tests.cjs || {
            echo 'Installed-app harness is not available yet. Use build-only for PR 1 packaging validation.' >&2
            exit 1
          }
      - name: Resolve immutable QA plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          QA_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/desktop/resolve-qa.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-qa-plan
          path: |
            qa-plan.json
            qa-invocation.json
          if-no-files-found: error
          retention-days: 14

  announce_validation:
    needs: resolve
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.mode != 'build-only' && inputs.scenario == 'electron-upgrade' && inputs.test_platform == 'all'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    uses: ./.github/workflows/desktop_validation_check.yml
    with:
      phase: start
      candidate-sha: ${{ needs.resolve.outputs.candidate-sha }}
      run-id: ${{ github.run_id }}

  approve:
    needs: resolve
    if: inputs.mode != 'test-only'
    name: Approve signing candidate ${{ needs.resolve.outputs.candidate-sha }}
    runs-on: ubuntu-24.04
    environment: desktop-qa-signing
    permissions: {}
    steps:
      - run: echo 'Maintainer approved the resolved source and QA-version plan shown in the run summary.'

  package:
    needs: [resolve, approve]
    if: inputs.mode != 'test-only'
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
    permissions:
      contents: read
    uses: ./.github/workflows/package_desktop.yml
    with:
      source-sha: ${{ matrix.build.sourceSha }}
      qa-version: ${{ matrix.build.version }}
      role: ${{ matrix.build.role }}
      artifact-prefix: desktop-qa-${{ matrix.build.role }}
      retention-days: 14
    secrets: inherit

  packages:
    needs: [resolve, package]
    if: inputs.mode != 'test-only'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-qa-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-qa-*-manifest
          path: package-manifests
      - name: Bind verified packages to immutable artifact IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop/collect-qa.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-qa-report
          path: qa-run.json
          if-no-files-found: error
          retention-days: 14

  prepare_tests:
    needs: [resolve, packages]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (inputs.mode == 'test-only' || (inputs.mode == 'build-and-test' && needs.packages.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - name: Resolve verified retained packages and required scenarios
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
          QA_TEST_PLATFORM: ${{ inputs.test_platform }}
        run: node scripts/desktop/prepare-qa-tests.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-test-plan
          path: qa-tests.json
          if-no-files-found: error
          retention-days: 14

  installed:
    needs: prepare_tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_tests.outputs.matrix) }}
    name: Installed ${{ matrix.platform }} / ${{ matrix.scenario }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a fresh test-only dispatch for reruns
        if: github.run_attempt != 1
        shell: bash
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: desktop-test-plan
      - name: Download exact baseline artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.fromArtifactId }}
          run-id: ${{ matrix.fromArtifactRunId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: baseline
      - name: Download exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.toArtifactId }}
          run-id: ${{ matrix.toArtifactRunId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate
      - name: Prepare Linux AppImage host and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb libnss3 libatk-bridge2.0-0 libgbm1
          # Permit Chromium's real user-namespace sandbox on this disposable VM.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install, update, and verify using the external controller
        shell: bash
        env:
          QA_TEST_CASE: ${{ matrix.scenario }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a --server-args='-screen 0 1440x1000x24' node scripts/desktop/run-update-tests.cjs
          else
            node scripts/desktop/run-update-tests.cjs
          fi
      - name: Retain controller and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-result-${{ matrix.platform }}-${{ matrix.scenario }}
          path: evidence/*
          if-no-files-found: warn
          retention-days: 14

  installed_result:
    needs: [prepare_tests, installed]
    if: always() && needs.prepare_tests.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-test-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-test-result-*
          path: test-results
      - name: Require the complete installed-app matrix
        run: node scripts/desktop/collect-qa-tests.cjs
      - name: Preserve exact-candidate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installed-report
          path: qa-installed-report.json
          if-no-files-found: error
          retention-days: 14
