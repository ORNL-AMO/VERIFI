<app-workspace-slideout title="Add analysis" description="Choose the category, then continue setup in the workbench." [saving]="saving" (closed)="cancelled.emit()">
  <form class="v1-analysis-draft" (submit)="$event.preventDefault(); submit()">
    <label><span>Category</span><select class="v1-select" [value]="category()" [disabled]="saving" (change)="setCategory($any($event.target).value)"><option value="energy" [disabled]="!energyAvailable">Energy</option><option value="water" [disabled]="!waterAvailable">Water</option></select></label>
    @if (!energyAvailable || !waterAvailable) { <div class="v1-alert v1-alert--info" role="status"><app-ui-icon name="info"></app-ui-icon><span>Categories without a matching facility meter group are unavailable.</span></div> }
    @if (error) { <div class="v1-alert v1-alert--danger" role="alert"><app-ui-icon name="warning"></app-ui-icon><span>{{ error }}</span></div> }
    <footer><button type="button" class="v1-btn v1-btn--quiet" [disabled]="saving" (click)="cancelled.emit()">Cancel</button><button type="submit" class="v1-btn v1-btn--action" [disabled]="saving || (category() === 'energy' ? !energyAvailable : !waterAvailable)">@if (saving) { <app-ui-icon name="loading" spin></app-ui-icon> } @else { <app-ui-icon name="add"></app-ui-icon> }Add analysis</button></footer>
  </form>
</app-workspace-slideout>
