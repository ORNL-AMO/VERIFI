@if (findings().length) {
  <ul class="v1-data-workbench-status-notes" [attr.aria-label]="label()">
    @for (finding of findings(); track finding.id) {
      <li class="analysis-status-note" [class.analysis-status-note--error]="finding.severity === 'error'">
        <app-ui-icon [name]="finding.severity === 'error' ? 'warning' : 'info'"></app-ui-icon>
        <span><strong>{{ finding.title }}</strong> {{ finding.description }}</span>
      </li>
    }
  </ul>
}
