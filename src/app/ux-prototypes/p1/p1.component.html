<section class="p1-prototype" [class.p1-dark]="darkMode" aria-label="VERIFI workspace concept">
  <app-p1-header-banner
    [account]="selectedAccount"
    [accounts]="data.accounts"
    [facility]="selectedFacility"
    [facilities]="accountFacilities"
    [contextMode]="contextMode"
    [isWorkspaceOpen]="isWorkspaceOpen"
    [darkMode]="darkMode"
    (welcomeRequested)="showWelcome()"
    (workspaceRequested)="openWorkspace()"
    (contextChange)="setContext($event)"
    (facilityChange)="setFacility($event)"
    (accountChange)="switchAccount($event)"
    (darkModeChange)="darkMode = $event">
  </app-p1-header-banner>

  @if (!isWorkspaceOpen) {
    <app-p1-welcome-screen
      [accounts]="data.accounts"
      [actions]="data.welcomeActions"
      (workspaceRequested)="openWorkspace($event)">
    </app-p1-welcome-screen>
  } @else {
    <app-p1-workspace-shell
      [sections]="data.sections"
      [activeSection]="activeSection"
      [contextMode]="contextMode"
      [account]="selectedAccount"
      [facility]="selectedFacility"
      [facilities]="accountFacilities"
      [navGroups]="data.nav[contextMode][activeSection]"
      [activeDetailId]="activeDetailId"
      [activeNavItem]="activeNavItem"
      [content]="data.content[contextMode][activeSection]"
      [panelContent]="data.panel[contextMode][activeSection]"
      [activePanelTab]="activePanelTab"
      [isRightPanelOpen]="isRightPanelOpen"
      (sectionChange)="setSection($event)"
      (detailChange)="setDetail($event)"
      (contextChange)="setContext($event)"
      (facilityChange)="setFacility($event)"
      (panelTabChange)="setPanelTab($event)"
      (rightPanelToggle)="toggleRightPanel()">
    </app-p1-workspace-shell>
  }
</section>
