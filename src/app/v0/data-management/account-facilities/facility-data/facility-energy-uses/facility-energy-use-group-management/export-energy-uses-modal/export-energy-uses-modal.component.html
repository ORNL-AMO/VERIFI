@let _exportYears = exportYears();

<div class="popup open">
    <div class="popup-header">
        <h5 class="mb-0 fs-6 d-inline">Export Energy Uses</h5>
        <button type="button" class="item-right" (click)="closeExportModal()">x</button>
    </div>
    <div class="popup-body">
        @if(_exportYears.length > 0) {
        <div class="d-flex align-items-center gap-5">
            <label for="energy-uses-export-year" class="form-label fw-bold mb-0">Year</label>
            <select id="energy-uses-export-year" class="form-select year-select" [ngModel]="selectedExportYear()"
                (ngModelChange)="selectExportYear($event)">
                @for(year of _exportYears; track year) {
                <option [ngValue]="year">{{year}}</option>
                }
            </select>
        </div>

        } @else {
        <div class="alert alert-info mb-0 mt-3">No annual energy use equipment data is available to export. Add
            a year of equipment data to get started.</div>
        }
    </div>
    <div class="popup-footer text-end">
        <button type="button" class="btn btn-secondary" (click)="closeExportModal()">Cancel</button>
        <button type="button" class="btn action-btn" (click)="exportEnergyUses()"
            [disabled]="!exportData()?.rows?.length">
            <span class="fa fa-download me-1"></span> Export Excel
        </button>
    </div>
</div>
