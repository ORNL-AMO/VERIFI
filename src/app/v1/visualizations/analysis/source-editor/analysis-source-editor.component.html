@if (view(); as context) {
  <app-visualization-resource-picker label="Analyses" icon="analysis" [control]="selectedAnalyses" [options]="resourceOptions()" [disabled]="context.disabled" [requestChanges]="true"
    (selectionRequested)="selectAnalysis($event.guid)" (selectionSetRequested)="setAnalyses($event)"/>
  @for (target of targets(); track target.guid) {
    @if (!target.account) {
      <app-visualization-resource-picker [label]="target.label + ' result scopes'" [control]="targetScopes.controls[target.guid]"
        [options]="[{ guid: 'total', label: 'Facility total' }].concat(target.groups)" [disabled]="context.disabled" [requestChanges]="true"
        (selectionRequested)="toggleTargetScope(target.guid, $event.guid, $event.selected)"
        (selectionSetRequested)="setTargetScopes(target.guid, $event)"/>
    }
  }
  <div [formGroup]="form">
    <label>Result period<select class="v1-select" formControlName="interval"><option value="monthly">Monthly</option><option value="yearly">Fiscal year</option></select></label>
    <span class="visualization-control-label">Charted Data</span>
    <div class="visualization-buttons" role="group" aria-label="Analysis measures">
      @for (measure of measureChoices(); track measure.value) { <button type="button" class="v1-btn v1-btn--quiet" [disabled]="context.disabled" [attr.aria-pressed]="measure.selected" (click)="toggleMeasure(measure.value)">{{ measure.label }}</button> }
    </div>
  </div>
  @if (issue(); as message) { <p role="status">{{ message }} Your saved settings are retained.</p> }
}
