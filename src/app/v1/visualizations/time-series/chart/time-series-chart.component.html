@if (model) {
  @if (model.chart.stack === 'percent') { <p class="time-series-share">Share of visible selected contributions for each period. Incomplete or zero totals have no percentage.</p> }
  @if (model.traces.length) {
    <div class="time-series-canvas" [appV1ECharts]="option()" (dataZoomChanged)="updateZoom($event)"></div>
  } @else { <p role="status">No visible series. Open a data source’s item settings and turn on Show trace.</p> }
}
