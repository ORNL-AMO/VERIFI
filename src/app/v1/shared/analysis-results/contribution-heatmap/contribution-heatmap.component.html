<section class="v1-contribution-heatmap" [class.v1-contribution-heatmap--compact]="compact()" [attr.aria-label]="title()">
  <div class="v1-contribution-heatmap__actions">
    <h2>{{ title() }}</h2>
    <button type="button" class="v1-icon-btn" title="Download PNG" [attr.aria-label]="downloadLabel()" (click)="download()">
      <app-ui-icon name="download"></app-ui-icon>
    </button>
  </div>
  <div class="v1-contribution-heatmap__scroll" tabindex="0" role="region" [attr.aria-label]="regionLabel()">
    <div class="v1-contribution-heatmap__chart" [style.height.px]="chartHeight()" [style.min-width.px]="chartWidth()"
      [appV1ECharts]="chartOption()" role="img" [attr.aria-label]="chartLabel()">
    </div>
  </div>
</section>
