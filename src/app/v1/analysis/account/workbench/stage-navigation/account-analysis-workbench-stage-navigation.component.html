<app-analysis-stage-navigation
  [stages]="workflow.stages()"
  layout="horizontal"
  [withContext]="workflow.resultTabs().length > 0"
  ariaLabel="Account analysis workflow stages">
</app-analysis-stage-navigation>
@if (workflow.resultTabs().length) {
  <app-data-workbench-tabs
    [tabs]="workflow.resultTabs()"
    [activeTab]="workflow.activeResultTabId()"
    level="secondary"
    ariaLabel="Account analysis result sections"
    (tabSelected)="workflow.openResultTab($event)">
  </app-data-workbench-tabs>
}
