@if (configurationIncomplete) {
  <div class="alert alert-info" role="status">
    Select a valid applied banking year and new baseline year in Analysis Options before viewing banked results.
  </div>
}

@if (!configurationIncomplete && calculating != false) {
  <div class="report">
    <app-calculating-spinner [message]="'Calculating Banked Results...'"
    [error]="calculating == 'error'"></app-calculating-spinner>
  </div>
}

<div class="quick-report">
  @if (!configurationIncomplete && calculating == false && groupSummary) {
    <app-group-analysis-report [groupSummary]="groupSummary"
      [analysisItem]="bankedAnalysisItem" [facility]="facility"
      [analysisReportSettings]="analysisReportSettings"
      [reportYear]="selectedGroup.bankedAnalysisYear"></app-group-analysis-report>
  }
</div>
