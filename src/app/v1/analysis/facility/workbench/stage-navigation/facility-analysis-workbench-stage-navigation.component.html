<app-analysis-stage-navigation
  [stages]="workflow.stages()"
  layout="horizontal"
  [withContext]="workflow.contextTabs().length > 0"
  ariaLabel="Analysis workflow stages">
</app-analysis-stage-navigation>
@if (workflow.contextTabs().length) {
  <app-data-workbench-tabs
    [tabs]="workflow.contextTabs()"
    [activeTab]="workflow.activeContextTabId()"
    [attention]="workflow.contextTabAttention()"
    attentionDisplay="indicator"
    level="secondary"
    [ariaLabel]="workflow.currentStage()?.kind === 'group' ? 'Meter group analysis sections' : 'Facility result sections'"
    (tabSelected)="workflow.openContextTab($event)">
  </app-data-workbench-tabs>
}
