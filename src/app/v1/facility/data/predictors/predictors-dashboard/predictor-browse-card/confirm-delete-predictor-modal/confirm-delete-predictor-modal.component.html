<div class="v1-modal-layer">
  <button type="button" class="v1-modal-backdrop" aria-label="Cancel delete predictor" [disabled]="saving" (click)="cancelled.emit()"></button>
  <section class="v1-modal" role="dialog" aria-modal="true" aria-labelledby="v1-delete-predictor-title">
    <header class="v1-modal__header">
      <h2 id="v1-delete-predictor-title">Delete {{ card.predictor.name || 'this predictor' }}?</h2>
      <button type="button" class="v1-icon-btn" aria-label="Cancel delete predictor" [disabled]="saving" (click)="cancelled.emit()"><app-ui-icon name="close"></app-ui-icon></button>
    </header>
    <div class="v1-modal__body">
      <p>This predictor, its {{ card.readingCount }} {{ card.readingCount === 1 ? 'reading' : 'readings' }}, and its analysis references will be removed.</p>
      <p><strong>This action cannot be undone.</strong></p>
      @if (error) { <div class="v1-alert v1-alert--danger" role="alert"><app-ui-icon name="warning"></app-ui-icon><span>{{ error }}</span></div> }
    </div>
    <footer class="v1-modal__footer">
      <button type="button" class="v1-btn v1-btn--quiet" [disabled]="saving" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="v1-btn v1-btn--danger" [disabled]="saving" (click)="confirmed.emit()">
        <app-ui-icon [name]="saving ? 'loading' : 'delete'" [spin]="saving"></app-ui-icon> Delete predictor
      </button>
    </footer>
  </section>
</div>
