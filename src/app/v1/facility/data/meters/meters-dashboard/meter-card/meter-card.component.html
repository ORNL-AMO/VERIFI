<article
  class="v1-meter-card"
  role="listitem"
  cdkDrag
  cdkDragPreviewContainer="parent"
  [cdkDragData]="card"
  [cdkDragDisabled]="!canMove">
  <div class="v1-meter-card__actions">
    <button type="button" class="v1-icon-btn v1-meter-card__drag" title="Drag meter" aria-label="Drag meter" cdkDragHandle [disabled]="!canMove">
      <span class="fa fa-grip-vertical" aria-hidden="true"></span>
    </button>
    <button type="button" class="v1-icon-btn" title="Open meter" aria-label="Open meter" (click)="opened.emit(card)">
      <span class="fa fa-arrow-right" aria-hidden="true"></span>
    </button>
  </div>

  <div class="v1-meter-card__body">
    <span class="v1-chip">{{ card.meter.source }}</span>
    <h3>
      <span class="fa fa-gauge-high" aria-hidden="true"></span>
      {{ card.meter.name }}
    </h3>
    <p>Coming soon</p>
  </div>

  <dl class="v1-meter-card__facts">
    <div>
      <dt>Readings</dt>
      <dd>{{ card.readingCount }}</dd>
    </div>
    <div>
      <dt>Group</dt>
      <dd>{{ card.group?.name || 'Ungrouped' }}</dd>
    </div>
  </dl>

  <button type="button" class="v1-btn v1-btn--sm v1-btn--quiet" [disabled]="!canMove" (click)="moveRequested.emit(card)">
    <span class="fa fa-arrow-right-arrow-left" aria-hidden="true"></span>
    Move meter
  </button>
</article>
