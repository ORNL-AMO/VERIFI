<div class="v1-modal-layer">
  <button
    type="button"
    class="v1-modal-backdrop"
    [attr.aria-label]="'Cancel deleting ' + monthLabel"
    [disabled]="saving"
    (click)="cancelled.emit()">
  </button>
  <section class="v1-modal" role="dialog" aria-modal="true" aria-labelledby="weather-reading-delete-title">
    <header class="v1-modal__header">
      <h2 id="weather-reading-delete-title">Delete {{ monthLabel }}?</h2>
      <button
        type="button"
        class="v1-icon-btn"
        [attr.aria-label]="'Cancel deleting ' + monthLabel"
        [disabled]="saving"
        (click)="cancelled.emit()">
        <app-ui-icon name="close"></app-ui-icon>
      </button>
    </header>
    <div class="v1-modal__body">
      @if (error) {
        <div class="v1-alert v1-alert--danger" role="alert">
          <app-ui-icon name="warning"></app-ui-icon>
          <span>{{ error }}</span>
        </div>
      }
      <p>This deletes every stored record for all predictors at this station in that month, including duplicates. This action cannot be undone.</p>
    </div>
    <footer class="v1-modal__footer">
      <button type="button" class="v1-btn v1-btn--quiet" [disabled]="saving" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="v1-btn v1-btn--danger" [disabled]="saving" (click)="confirmed.emit()">
        <app-ui-icon [name]="saving ? 'loading' : 'delete'" [spin]="saving"></app-ui-icon>
        Delete month
      </button>
    </footer>
  </section>
</div>
