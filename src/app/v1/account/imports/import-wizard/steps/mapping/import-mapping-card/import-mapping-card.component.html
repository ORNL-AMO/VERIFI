<article
  class="import-drag-card import-mapping-card"
  role="listitem"
  cdkDrag
  cdkDragPreviewContainer="parent"
  [cdkDragData]="card">
  <button
    type="button"
    class="v1-icon-btn import-drag-card__drag"
    cdkDragHandle
    [attr.aria-label]="'Drag ' + card.label">
    <app-ui-icon name="drag"></app-ui-icon>
  </button>

  <div class="import-drag-card__main">
    <label class="import-drag-card__select">
      <input
        type="checkbox"
        [checked]="selected"
        [attr.aria-label]="'Select ' + card.label"
        (change)="selectedChange.emit($any($event.target).checked)">
      <span class="visually-hidden">Select {{ card.label }}</span>
    </label>
    <h3>{{ card.label }}</h3>
  </div>

  <label class="import-drag-card__move">
    <span class="visually-hidden">Move {{ card.label }} to</span>
    <select class="v1-select" #moveTarget [value]="''" (change)="move(moveTarget.value); moveTarget.value = ''">
      <option value="" disabled>Move to…</option>
      @for (destination of destinations; track destination.id) {
        @if (destination.facilityId !== card.facilityId) {
          <option [value]="destinationValue(destination)">{{ destination.label }}</option>
        }
      }
    </select>
  </label>
</article>
