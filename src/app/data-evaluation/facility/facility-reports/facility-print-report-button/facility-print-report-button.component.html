<div class="button-div hide-print" [ngStyle]="{'right.px': helpWidth}">
    <div class="d-flex flex-column">
        <div class="p-2">
            <button class="btn action-btn" (click)="togglePrint()" title="Generate PDF Report">
                <span class="fa fa-file-pdf"></span>
            </button>
        </div>
          <div class="p-2">
            <button class="btn action-btn" (click)="exportPpt()" title="Generate PPT Report">
                <span class="fa fa-file-powerpoint"></span>
            </button>
        </div>
    </div>
</div>
