<div class="inventory-chart-dock">
  <button type="button" class="inventory-chart-dock__handle" aria-haspopup="dialog" [attr.aria-expanded]="open()" aria-controls="inventory-chart-sheet" [disabled]="disabled()" (click)="opened.emit()" (pointerdown)="startPull($event)" (pointerup)="finishPull($event)" (pointercancel)="cancelPull()">
    <span class="inventory-chart-dock__grip" aria-hidden="true"></span><app-ui-icon name="chevronUp"/><span>Charts</span>
  </button>
</div>
