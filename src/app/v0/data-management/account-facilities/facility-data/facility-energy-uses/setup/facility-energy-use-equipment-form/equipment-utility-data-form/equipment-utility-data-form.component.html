@let _energySource = energySource();

<form [formGroup]="utilityDataForm()">
    <div class="form-group row mt-2">
        <div class="d-flex w-100 justify-content-between">
            <div>
                <span class="badge me-1 badge-text"
                    [ngStyle]="{'background-color': _energySource | meterSourceColor}">{{_energySource}}
                    Data</span>
            </div>
            <div class="mt-auto">
                <button type="button" class="btn-close" aria-label="Close" (click)="removeUtilityType()"></button>
            </div>
        </div>
    </div>

    @if (showMissingUtilityMeterWarning) {
    <div class="alert alert-warning text-danger small p-2 mt-2 mb-2 utility-meter-warning">
        <i class="fa fa-exclamation-triangle text-danger"></i>
        No {{_energySource}} meter was found in the connected utility meter group.
    </div>
    }
    <div class="form-group row">
        <label class="col-5 col-form-label" for="size_{{_energySource}}">
            {{ equipmentDetailsForm().get('equipmentType').value | sizeLabel }}
        </label>
        <div class="col-7 ">
            <div class="input-group">
                @if (showRatedCapacityCalculator) {
                <span class="input-group-text">
                    <button type="button" class="btn p-0 border-0 bg-transparent" (click)="openCalculateRatedPowerModal()">
                        <i class="fa fa-calculator text-primary icon-style"></i>
                    </button>
                </span>
                }
                <input id="size_{{_energySource}}" class="form-control" type="number" formControlName="size"
                    onfocus="this.select();" min="0">
                <select class="input-group-text" id="units_{{_energySource}}" name="units" formControlName="units">
                    @for(option of (_energySource | equipmentUnitOptions); track option.value) {
                    <option [ngValue]="option.value">
                        <span [innerHTML]="option.value | settingsLabel"></span>
                    </option>
                    }
                </select>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <label class="col-5 col-form-label" for="numberOfEquipment_{{_energySource}}">Number of
            Equipment</label>
        <div class="col-7">
            <input id="numberOfEquipment_{{_energySource}}" class="form-control" type="number"
                formControlName="numberOfEquipment" onfocus="this.select();" min="0">
        </div>
    </div>
</form>

<div [ngClass]="{'windowOverlay': showRatedPowerModal && showRatedCapacityCalculator}"></div>
@if (showRatedPowerModal && showRatedCapacityCalculator) {
<app-rated-power-modal [energySource]="_energySource" [linkedMeters]="linkedFuelMeters"
    [initialPowerUnit]="utilityDataForm().controls.units.value" (applyRatedPower)="applyRatedPower($event)"
    (closeModal)="closeCalculateRatedPowerModal()"></app-rated-power-modal>
}
