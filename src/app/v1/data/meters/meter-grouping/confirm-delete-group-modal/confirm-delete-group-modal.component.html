<app-confirmation-dialog
  [title]="'Delete ' + group.name + '?'"
  titleId="v1-delete-meter-group-title"
  cancelAriaLabel="Cancel delete group"
  confirmLabel="Delete group"
  confirmIcon="delete"
  [busy]="saving"
  [disabled]="saving"
  (confirmed)="confirmed.emit()"
  (cancelled)="cancelled.emit()">
  <p>
    This group will be removed. {{ assignedMeterCount }}
    {{ assignedMeterCount === 1 ? 'meter' : 'meters' }} will move to Ungrouped.
  </p>
  @if (error) {
    <div class="v1-alert v1-alert--danger" role="alert">
      <app-ui-icon name="warning"></app-ui-icon>
      <span>{{ error }}</span>
    </div>
  }
</app-confirmation-dialog>
