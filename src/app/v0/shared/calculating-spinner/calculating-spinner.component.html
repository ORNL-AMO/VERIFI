@if (!error) {
  <div class="w-100">
    <div class="loading-screen">
      <!-- <div class="main-content"> -->
      <div class="spinner">
        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>
      </div>
      @if (!message) {
        <h3>Calculating Results...</h3>
      }
      @if (message) {
        <h3>{{message}}</h3>
      }
    <!-- </div> -->
  </div>
</div>
}

@if (error) {
  <div class="alert alert-danger d-flex align-items-center justify-content-between gap-3" role="alert">
    <span>An error occurred during calculations.</span>
    @if (retryable) {
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="retry.emit()">Retry</button>
    }
  </div>
}
