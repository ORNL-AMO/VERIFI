<nav
  class="v1-analysis-stages"
  [class.v1-analysis-stages--horizontal]="layout() === 'horizontal'"
  [class.v1-analysis-stages--with-context]="withContext()"
  [attr.aria-label]="ariaLabel()">
  <ol>
    @for (stage of views(); track stage.id) {
      <li [class.is-current]="stage.current" [class.is-complete]="stage.completed" [class.is-blocked]="!stage.canOpen">
        <ng-template #contents>
          <span class="v1-analysis-stages__marker" [class.is-complete]="stage.completed" [class.has-blocking-errors]="stage.hasBlockingErrors">
            @if (stage.markerIcon) { <app-ui-icon [name]="stage.markerIcon"></app-ui-icon> }
            @if (stage.markerLabel) { <span class="visually-hidden">{{ stage.markerLabel }}</span> }
          </span>
          <span class="v1-analysis-stages__label">{{ stage.label }}</span>
          @if (stage.hasBlockingErrors && stage.attentionDescription) {
            <span class="visually-hidden">{{ stage.attentionDescription }}</span>
          } @else {
            <app-status-attention [summary]="stage.attention" [contextLabel]="stage.label" [display]="layout() === 'vertical' ? 'count' : 'indicator'"></app-status-attention>
          }
        </ng-template>
        @if (stage.canOpen) {
          <a [routerLink]="stage.route" [attr.aria-current]="stage.current ? 'step' : null">
            <ng-container [ngTemplateOutlet]="contents"></ng-container>
          </a>
        } @else {
          <span class="v1-analysis-stages__disabled" aria-disabled="true">
            <ng-container [ngTemplateOutlet]="contents"></ng-container>
          </span>
        }
      </li>
    }
  </ol>
</nav>
