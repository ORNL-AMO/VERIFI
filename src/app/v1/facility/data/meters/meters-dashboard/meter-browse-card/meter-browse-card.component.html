<app-resource-browse-card
  [view]="resourceView"
  [actions]="resourceActions"
  (opened)="openSettings()"
  (actionSelected)="handleCardAction($event)">
</app-resource-browse-card>

<ng-template #copyMeterConfirmModal>
  @if (meterToCopy(); as cardToCopy) {
    <app-confirm-copy-meter-modal
      [card]="cardToCopy"
      [saving]="saving()"
      [error]="actionError()"
      (confirmed)="confirmCopyMeter()"
      (cancelled)="cancelCopyMeter()">
    </app-confirm-copy-meter-modal>
  }
</ng-template>

<ng-template #deleteMeterConfirmModal>
  @if (meterToDelete(); as cardToDelete) {
    <app-confirm-delete-meter-modal
      [card]="cardToDelete"
      [saving]="saving()"
      [error]="actionError()"
      (confirmed)="confirmDeleteMeter()"
      (cancelled)="cancelDeleteMeter()">
    </app-confirm-delete-meter-modal>
  }
</ng-template>
