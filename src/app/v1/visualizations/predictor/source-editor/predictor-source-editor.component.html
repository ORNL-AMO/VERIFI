@if (contextState(); as view) {
<app-visualization-resource-picker label="Predictors" icon="predictor" [control]="selected" [options]="choices()"
  [allMode]="allMode()" allLabel="All Predictors" (allSelectionRequested)="selectAll($event)" [disabled]="view.disabled" [requestChanges]="true" (selectionRequested)="toggleSelection($event)" (selectionSetRequested)="setSelection($event)"/>

@for (item of items(); track item.key) {
  @if (!item.available) { <p role="status">{{ item.label }}: {{ item.missing ? 'Selected predictor unavailable. Choose a supported predictor to repair this selection.' : 'Predictor type not supported.' }}</p> }
}
}
