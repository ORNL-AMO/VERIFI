@if (showManagement()) {
<section class="v1-workbench-section annual-data__heading" aria-labelledby="annual-data-title">
  <h2 id="annual-data-title">Annual data</h2>
  <button type="button" class="v1-btn v1-btn--action" [disabled]="!canManageYears()" (click)="addRequested.emit()"><app-ui-icon name="add"/>Add year</button>
</section>
}
@for (year of years(); track year.year) {
  <app-energy-use-annual-year-fields [year]="year" [editorKey]="editorKey()" [canEdit]="canEdit()" [canManageYears]="canManageYears()"
    [showManagement]="showManagement()" [embeddedCalculators]="embeddedCalculators()" (calculatorRequested)="calculatorRequested.emit($event)"
    (copyRequested)="copyRequested.emit($event)" (removeRequested)="removeRequested.emit($event)"/>
} @empty {
  <section class="v1-workbench-section"><p>No annual data. Add a fiscal year to enter operating assumptions and estimate consumption.</p></section>
}
