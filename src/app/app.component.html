<div class="container-fluid p-0 m-0">
  <div class="d-flex flex-column h-100">
    <div class="d-flex overflow-hidden flex-grow-1">
      @if (startupState().status === 'initializing') {
        <main class="app-startup-content w-100" aria-live="polite" aria-busy="true">
          <div class="loading-screen">
            <div class="spinner" aria-hidden="true">
              <div class="bounce1"></div>
              <div class="bounce2"></div>
              <div class="bounce3"></div>
            </div>
            <h1>{{ startupState().message }}</h1>
          </div>
        </main>
      } @else {
        <main class="app-route-content w-100" role="main">
          @if (startupState().status === 'error') {
            @if (startupState().error; as startupError) {
              <app-startup-error [error]="startupError" (retryRequested)="retryStartup()"></app-startup-error>
            }
          }
          <router-outlet></router-outlet>
        </main>
      }
    </div>
    @if (workspaceStatus() === 'switching') {
      <div class="workspace-switch-overlay" role="status" aria-live="polite" aria-busy="true">
        <div class="workspace-switch-status">
          <div class="spinner" aria-hidden="true">
            <div class="bounce1"></div><div class="bounce2"></div><div class="bounce3"></div>
          </div>
          <h1 class="h4 mb-0">Switching accounts...</h1>
        </div>
      </div>
    }
    <app-loading class="hide-print"></app-loading>
    <app-electron-update class="hide-print"></app-electron-update>
    <app-electron-backup-file class="hide-print"></app-electron-backup-file>
    <app-shared-router-guard-modal class="hide-print"></app-shared-router-guard-modal>
  </div>
</div>
