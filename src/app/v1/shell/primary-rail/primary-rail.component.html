<nav class="v1-rail" aria-label="Primary workspace navigation">
  @let activeSection = navigation.activeSection();

  @for (section of navigation.sections(); track section.id) {
    @if (section.enabled) {
      <button
        type="button"
        [class.active]="activeSection === section.id"
        [attr.aria-current]="activeSection === section.id ? 'page' : null"
        (click)="navigation.openSection(section.id)">
        <app-ui-icon [name]="section.icon"></app-ui-icon>
        <span>{{ section.shortLabel }}</span>
      </button>
    } @else {
      <button type="button" disabled [title]="section.label + ' will be added in a later v1 workflow'">
        <app-ui-icon [name]="section.icon"></app-ui-icon>
        <span>{{ section.shortLabel }}</span>
      </button>
    }
  }
</nav>
