@let currentFacility = facility();

<section class="v1-facility-settings" aria-labelledby="v1-facility-settings-title">
  <header class="v1-section-header">
    <app-page-identity [breadcrumbs]="breadcrumbs()" (breadcrumbSelected)="navigation.changeFacilityScope({ kind: 'all' })"
      title="Settings" icon="settings" headingId="v1-facility-settings-title" breadcrumbLabel="Settings context"/>
  </header>

  @if (!currentFacility) {
    <article class="v1-empty-state" role="status">
      <app-ui-icon name="facility"></app-ui-icon>
      <h2>No facility selected</h2>
      <p>Select a facility to edit facility settings.</p>
    </article>
  } @else {
    @if (!canWrite()) {
      <div class="v1-alert v1-alert--warning" role="status">
        <app-ui-icon name="lock"></app-ui-icon>
        <span>Settings are unavailable while the workspace is loading or switching.</span>
      </div>
    }

    <router-outlet></router-outlet>
  }
</section>
