<app-confirmation-dialog
  [title]="'Copy ' + card.meter.name + '?'"
  titleId="v1-copy-meter-title"
  cancelAriaLabel="Cancel copy meter"
  confirmLabel="Copy meter"
  confirmClass="v1-btn--action"
  confirmIcon="copy"
  [busy]="saving"
  [disabled]="saving"
  (confirmed)="confirmed.emit()"
  (cancelled)="cancelled.emit()">
  <p>A new meter will be created with the same setup. Readings will not be copied.</p>
  @if (error) {
    <div class="v1-alert v1-alert--danger" role="alert">
      <app-ui-icon name="warning"></app-ui-icon>
      <span>{{ error }}</span>
    </div>
  }
</app-confirmation-dialog>
