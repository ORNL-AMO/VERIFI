<nav class="v1-rail" aria-label="Primary workspace navigation">
  @for (section of navigation.sections(); track section.id) {
    @if (section.enabled) {
      <button
        type="button"
        class="active"
        [attr.aria-current]="navigation.activeSection() === section.id ? 'page' : null">
        <span [class]="'fa ' + section.icon" aria-hidden="true"></span>
        <span>{{ section.shortLabel }}</span>
      </button>
    } @else {
      <button type="button" disabled [title]="section.label + ' will be added in a later v1 workflow'">
        <span [class]="'fa ' + section.icon" aria-hidden="true"></span>
        <span>{{ section.shortLabel }}</span>
      </button>
    }
  }
</nav>
