<app-resource-browse-card [view]="view()" [actions]="actions()" [actionMenu]="true" (opened)="opened.emit(card())" (actionSelected)="selectAction($event)">
  @if (showGroupDetails() && card().analysis.groups?.length) {
    <app-facility-analysis-group-model-roster
      resource-card-after-facts
      [analysis]="card().analysis"
      [meterGroups]="meterGroups()"
      [compact]="true">
    </app-facility-analysis-group-model-roster>
  }
</app-resource-browse-card>
