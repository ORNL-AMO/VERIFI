@let account = navigation.account();

@if (hasSingleSiteRecovery() && account) {
  <section class="v1-nav__recovery v1-alert v1-alert--warning" aria-labelledby="v1-single-site-recovery-title">
    <app-ui-icon name="warning"></app-ui-icon>
    <div>
      <strong id="v1-single-site-recovery-title">{{ recoveryTitle() }}</strong>
      <p>{{ recoveryMessage() }}</p>
      <a [routerLink]="navigation.legacyFacilityManagementRoute(account.guid)">Open facility management</a>
    </div>
  </section>
}
