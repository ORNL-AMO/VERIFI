<section class="meter-settings-section" [formGroup]="form">
  <h3>Status settings</h3>
  <div class="meter-settings-checks">
    <label class="meter-settings-check">
      <input type="checkbox" class="form-check-input" formControlName="noLongerInUse" (change)="immediateChange.emit()">
      <span>No Longer In Use</span>
    </label>

    @if (form.controls.noLongerInUse.value) {
      <div class="v1-settings-grid v1-settings-grid--2">
        <label class="meter-settings-field">
          <span>Stop Month</span>
          <select class="form-select" formControlName="noLongerInUseMonth" (change)="immediateChange.emit()">
            <option [ngValue]="null" disabled>Month</option>
            @for (month of viewModel.months; track month.monthNumValue) {
              <option [ngValue]="month.monthNumValue">{{ month.abbreviation }}</option>
            }
          </select>
        </label>
        <label class="meter-settings-field">
          <span>Stop Year</span>
          <select class="form-select" formControlName="noLongerInUseYear" (change)="immediateChange.emit()">
            <option [ngValue]="null" disabled>Year</option>
            @for (year of viewModel.noLongerInUseYearOptions; track year) {
              <option [ngValue]="year">{{ year }}</option>
            }
          </select>
        </label>
      </div>
    }

    <label class="meter-settings-check">
      <input type="checkbox" class="form-check-input" formControlName="canBeNegative" (change)="immediateChange.emit()">
      <span>Can Be Negative</span>
    </label>

    <label class="meter-settings-check">
      <input type="checkbox" class="form-check-input" formControlName="ignoreDateStatusChecks" (change)="immediateChange.emit()">
      <span>Ignore Date Related Status Checks</span>
    </label>
  </div>
</section>
