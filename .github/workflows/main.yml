name: CI/CD

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - 'master'
      - 'develop'
  pull_request:
    branches:
      - 'master'
      - 'develop'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Get Node version
        id: node
        run: node -p '"version=" + require("./package.json").engines.node' >> "$GITHUB_OUTPUT"
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm run test:all:ci

  qa:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release_qa.yml

  web:
    needs: test
    if: github.ref_name == 'develop' || github.ref_name == 'master'
    uses: ./.github/workflows/release_web.yml

  desktop:
    needs: test
    if: github.ref_name == 'master'
    uses: ./.github/workflows/release_desktop.yml
    secrets: inherit
