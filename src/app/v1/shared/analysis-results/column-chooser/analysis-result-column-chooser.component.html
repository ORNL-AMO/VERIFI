<button type="button" class="v1-btn v1-btn--quiet" (click)="openSlideout()">
  <app-ui-icon name="settingsSliders"></app-ui-icon>
  Choose Columns
</button>
@if (open()) {
  <app-analysis-column-picker [sections]="pickerSections()" [description]="'Choose the fields shown in the ' + period() + ' result table.'"
    (closed)="closeSlideout()" (applied)="apply()" (showAllRequested)="showAll()" (hideAllRequested)="hideAll()" (defaultsRequested)="useDefaults()"/>
}
