<div class="v1-facility-picker" (keydown.escape)="onEscape()">
  @if (facilities.length === 1 && selectedFacility) {
    <div class="v1-facility-picker__single">
      <app-ui-icon name="facility"></app-ui-icon>
      <span>{{ facilities[0]?.name ?? 'Select facility' }}</span>
    </div>
  } @else {
    <div cdkOverlayOrigin #origin="cdkOverlayOrigin" class="v1-facility-picker__wrap" [class.open]="open">
      <button
        #toggleButton
        type="button"
        class="v1-facility-picker__toggle"
        (click)="toggle()"
        [attr.aria-expanded]="open"
        aria-haspopup="dialog" [disabled]="!facilities.length">
        <app-ui-icon name="facility"></app-ui-icon>
        <span class="v1-facility-picker__label">{{ selectedFacility?.name ?? 'Choose facility…' }}</span>
        <app-ui-icon name="chevronDown" class="v1-facility-picker__chevron"></app-ui-icon>
      </button>

      <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="origin" [cdkConnectedOverlayOpen]="open" [cdkConnectedOverlayWidth]="menuWidth" [cdkConnectedOverlayHasBackdrop]="true" [cdkConnectedOverlayFlexibleDimensions]="true" [cdkConnectedOverlayPush]="true" [cdkConnectedOverlayViewportMargin]="12" cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop" (backdropClick)="close()">
        <div [class]="overlayClasses()">
        <div class="v1-facility-picker__menu" role="dialog" aria-label="Choose facility" (keydown)="onMenuKeydown($event)">
            <div class="v1-facility-picker__search">
              <app-ui-icon name="search" class="v1-facility-picker__search-icon"></app-ui-icon>
              <input
                class="v1-facility-picker__search-input"
                type="search"
                placeholder="Search facilities…"
                aria-label="Search facilities"
                autocomplete="off"
                [formControl]="search" />
            </div>
          <div class="v1-facility-picker__list">
            @for (facility of filteredFacilities(); track facility.guid) {
              <button
                type="button"
                class="v1-facility-picker__item"
                [attr.aria-pressed]="facility.guid === selectedFacility?.guid"
                [class.active]="facility.guid === selectedFacility?.guid"
                (click)="select(facility.guid)">
                <app-ui-icon name="check" class="v1-facility-picker__check"></app-ui-icon>
                <span class="v1-facility-picker__item-text">
                  {{ facility.name }}
                  @if (facility.location) {
                    <small>{{ facility.location }}</small>
                  }
                </span>
              </button>
            }
            @if (filteredFacilities().length === 0) {
              <span class="v1-facility-picker__empty">No facilities match</span>
            }
          </div>
        </div>
        </div>
      </ng-template>
    </div>
  }
</div>
