<section class="portfolio-predictors" aria-label="Portfolio predictors" [appBrowsePosition]="browseKey()" [browsePositionReady]="browseReady()" [browseRestoreStickyGap]="true" [browseVisibleIds]="browseIds()">
  <form class="v1-data-browse-toolbar portfolio-inventory-toolbar" aria-label="Predictor filters" [formGroup]="filtersForm" (ngSubmit)="$event.preventDefault()">
    <div class="v1-portfolio-browse-search"><p class="v1-portfolio-browse-count" role="status">Showing {{ filteredEntries().length }} of {{ entries().length }} predictors</p>
      <div class="v1-data-browse-search"><span class="input-group-text"><app-ui-icon name="search"/></span><input type="search" formControlName="search" aria-label="Find predictor, facility, station, unit, or status" placeholder="Find predictor, facility, station, unit, or status"></div>
    </div>
    <label><span>Type</span><select class="v1-select" formControlName="type"><option value="all">All</option><option value="standard">Standard</option><option value="weather">Weather</option></select></label>
    <label><span>Status</span><select class="v1-select" formControlName="status"><option value="all">All</option><option value="attention">Needs attention</option><option value="noReadings">No readings</option><option value="clear">All data valid</option></select></label>
    <label><span>Sort</span><select class="v1-select" formControlName="sort"><option value="attention">Attention first</option><option value="facilityName">Facility name</option><option value="latestReading">Latest reading</option></select></label>
    <label><span>Facility</span><select class="v1-select" formControlName="facilityGuid" aria-label="Facility"><option value="">All facilities</option>@for (facility of facilities(); track facility.guid) { <option [value]="facility.guid">{{ facility.name }}</option> }</select></label>
    <label><span>Detail level</span><select class="v1-select" aria-label="Detail level" [formControl]="inventory.detailControl"><option value="simple">Simple</option><option value="summary">Summary</option><option value="detailed">Detailed</option></select></label>
  </form>
  @if (navigationError()) { <p class="v1-alert v1-alert--danger" role="alert">{{ navigationError() }}</p> }
  @if (!entries().length) { <app-data-empty-state icon="predictor" title="No predictors" description="Add or upload predictors for a facility to get started."/> }
  @else if (!filteredEntries().length) { <article class="v1-empty-state" role="status"><h2>No predictors match these filters</h2><button type="button" class="v1-btn v1-btn--quiet" (click)="clearFilters()">Clear filters</button></article> }
  @else {
    <app-inventory-grid [actions]="cardActions.actions()" [actionsByGuid]="cardActions.actionsByGuid()" (actionRequested)="cardActions.request($event)" [tiles]="inventory.visibleTiles()" [printTiles]="tiles()" [detail]="inventory.detail()" [overrides]="inventory.overrides()" [page]="inventory.page()" [pages]="inventory.pages()" [start]="inventory.start()" [end]="inventory.end()" [total]="filteredEntries().length" (detailChanged)="inventory.setTileDetail($event)" (pageSelected)="inventory.selectPage($event)" (navigationRequested)="navigateRoute($event)"/>
  }
</section>

<app-account-inventory-actions #cardActions resource="predictors"/>
