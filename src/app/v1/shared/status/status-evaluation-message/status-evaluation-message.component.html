@switch (state()) {
  @case ('idle') {
    <div class="v1-alert v1-alert--info" role="status">Loading workspace…</div>
  }
  @case ('evaluating') {
    <div class="v1-alert v1-alert--info" role="status">Updating data checks…</div>
  }
  @case ('error') {
    <div class="v1-alert v1-alert--danger" role="alert">Data checks are unavailable. Warnings and attention counts cannot currently be verified.</div>
  }
}
