@let resultState = results.state();
<section class="v1-analysis-results-page" aria-label="Annual results">
  @if (results.hasBlockingErrors() || resultState.state !== 'ready' || !rows().length) {
  <div class="v1-analysis-results-page__intro v1-analysis-results-page__intro--standalone">
    <app-analysis-result-status
      scope="group"
      period="annual"
      [state]="resultState"
      [blocking]="results.hasBlockingErrors()"
      [rowCount]="rows().length">
    </app-analysis-result-status>
  </div>
  }

  @if (!results.hasBlockingErrors() && resultState.state === 'ready' && rows().length) {
    <section class="v1-analysis-results-page__table" aria-label="Group annual analysis table">
      <div class="v1-analysis-results-page__table-actions" aria-label="Annual table controls">
        <app-analysis-result-column-chooser
          period="annual"
          [hasBanking]="hasBanking()"
          [predictorScopeId]="predictorScopeId()"
          [predictorVariables]="availablePredictors()">
        </app-analysis-result-column-chooser>
      </div>
      <app-analysis-results-table [view]="tableView()" period="annual"
        caption="Group annual analysis results" [unit]="unit()" [category]="groupContext.autosave.draft()?.analysisCategory ?? 'energy'"/>
      <app-analysis-result-marker-legend [markers]="legendMarkers()"></app-analysis-result-marker-legend>
    </section>

    <app-analysis-result-charts class="v1-analysis-results-page__charts" [view]="charts()" scope="group"/>
  }
</section>
