name: "Deploy: Web"

on:
  workflow_call:

# web-dist is built by the caller so compilation can run alongside desktop
# packaging while the production deployment waits for the desktop release gate.
jobs:
  call_deploy-dev:
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/template_deploy.yml
    with:
      app-dir: verifi
      artifact-name: web-dist
      backup-dir: /opt/actions-runner/backups
      deploy-dir: /var/www/html
      tag: dev

  call_deploy-prod:
    if: github.ref_name == 'master'
    uses: ./.github/workflows/template_deploy.yml
    with:
      app-dir: verifi
      artifact-name: web-dist
      backup-dir: /opt/actions-runner/backups
      deploy-dir: /var/www/html
      tag: prod
