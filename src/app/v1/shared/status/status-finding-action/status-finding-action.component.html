@let finding = item();
@if (finding.destination.kind === 'unavailable') {
  <small>{{ finding.unavailableReason || 'Fix workflow not yet available in v1' }}</small>
} @else {
  <button type="button" class="v1-btn v1-btn--sm v1-btn--quiet" [attr.aria-label]="label() + ' for ' + finding.entity.name" (click)="status.navigateTo(finding)">{{ label() }}</button>
}
